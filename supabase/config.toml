# Configuração local do Supabase CLI (apenas as funções deste projeto).
# A linha mais importante: o webhook precisa ser PÚBLICO (a Meta chama sem JWT).

project_id = "owauukcjdasumguvzqch"

[functions.wa-send]
# Exige JWT do usuário do ERP (chamada autenticada a partir do front).
verify_jwt = true

[functions.wa-webhook]
# Público: a Meta chama este endpoint sem Authorization.
verify_jwt = false

[functions.gcal]
# Google Agenda. Exige JWT do usuário do ERP: a agenda consultada é sempre a
# de quem chamou, resolvida pelo token — nunca por um id vindo do body.
verify_jwt = true

[functions.google-oauth-start]
# Exige JWT: e aqui que o `state` do OAuth e amarrado ao usuario.
verify_jwt = true

[functions.cora]
# Cobranca. Exige JWT -- mas verify_jwt so prova "esta logado", e o perfil
# 'cliente' tambem esta. A checagem de perfil (admin/gestor/financeiro) e
# feita DENTRO da funcao, contra profiles.role.
verify_jwt = true

[functions.cora-oauth-start]
# Exige JWT: e aqui que o `state` do OAuth e amarrado a organizacao.
verify_jwt = true

[functions.cora-oauth-callback]
# PUBLICO, obrigatoriamente: quem chama e o navegador voltando da Cora numa
# navegacao de pagina inteira, sem cabecalho Authorization. Quem prova a
# identidade e o `state` gravado pela cora-oauth-start.
# Este e o endereco cadastrado como "link de redirecionamento" no painel da Cora.
verify_jwt = false

[functions.cora-webhook]
# PUBLICO, obrigatoriamente: a Cora chama sem Authorization e com corpo VAZIO.
# Nao ha HMAC nem segredo compartilhado. A autenticidade NAO vem do POST -- vem
# do GET /v2/invoices/{id} que fazemos de volta com o nosso proprio token.
# O token no path serve para nao sermos varridos, nao para autenticar.
verify_jwt = false

[functions.cora-spike]
# TEMPORARIA. Responde uma pergunta so: `Deno.createHttpClient` consegue
# apresentar certificado de cliente (mTLS) neste runtime? A resposta decide se
# Cora e NFS-e ficam dentro do Supabase ou precisam de um proxy externo.
# Apagar a funcao assim que o resultado estiver registrado.
verify_jwt = true

[functions.google-oauth-callback]
# PUBLICO, obrigatoriamente: quem chama e o navegador voltando do Google numa
# navegacao de pagina inteira, sem cabecalho Authorization. Quem prova a
# identidade e o `state` gravado pela google-oauth-start.
verify_jwt = false
